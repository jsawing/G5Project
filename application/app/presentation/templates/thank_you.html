{% extends "base.html" %}
{% block title %}Tack - Zen Nyhetsbrev{% endblock %}

{% block content %}
<section class="thank-you">
    <div class="thank-you__container">
        <div class="thank-you__icon">&#10003;</div>
        <h1 class="thank-you__title">Tack, {{ name }}!</h1>
        <p class="thank-you__message">Vi har tagit emot din prenumeration för:</p>
        <p class="thank-you__email">{{ email }}</p>
        <a href="{{ url_for('public.index') }}" class="btn btn--primary thank-you__home">Till startsidan</a>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        const SUCCESS_FLAG_KEY = 'zen_subscribe_success';
        if (sessionStorage.getItem(SUCCESS_FLAG_KEY) === '1') {
            window.alert('Tack! Din prenumeration har registrerats.');
            sessionStorage.removeItem(SUCCESS_FLAG_KEY);
        }
    })();
</script>
{% endblock %}
