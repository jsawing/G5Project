<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}News Flash{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='img/Artclass.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header__container">
            <a href="/" class="header__logo">
                <span class="header__logo-icon">和</span>
                Zen Nyhetsbrev
            </a>
            <nav class="header__nav">
                <a href="/" class="header__nav-link">Hem</a>
                <a href="{{ url_for('public.subscribe') }}" class="header__nav-link">Prenumerera</a>
                <a href="{{ url_for('public.admin') }}" class="header__nav-link">Admin</a>
            </nav>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer__container">
            <p class="footer__text">
                &copy; 2026 Zen Nyhetsbrev • Byggt med Flask
            </p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
